name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile Python
        run: python -m compileall -q examples tools

      - name: Check Turtle helper imports headlessly
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('tools/turtle_smoke.py').read_text(encoding='utf-8'))"

      - name: Check Markdown links
        run: python tools/check_links.py

      - name: Check M2 repository readiness
        run: python tools/check_m2_readiness.py

      - name: Run tests
        run: pytest -q
